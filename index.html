<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Transaction Input</title>
<link rel="stylesheet" href="style.css">
<script src="https://unpkg.com/lucide@0.263.1/dist/umd/lucide.min.js"></script></head>

<body>
<div class="app-container">

<header class="header">
  <div class="header-text">
    <p>Overview</p>
    <h2>Finance</h2>
  </div>

  <div class="settings">
    <button class="button button1">$</button>
    </div>
</header>


<main id ="main-content">
  <div id="month-section">
   <div class="carder">
    <div class="month-nav">
      <button id="prev-month"><

      </button>
      <span id="month-display">March 2026</span>
      <button id="next-month">>

      </button>
        </div>
      </div> 
  </div>
      <div id="dashboard-top"> 
      <div class="card-section">
        <div class="card-income">
          <i data-lucide="trending-up" class="income-icon" ></i>
          <p class="label">DAILY INCOME</p>
          <p id="avg-income">
          </p>
        </div>
        <div class="card-expense">
          <i data-lucide="trending-down" class="expense-icon"></i>         
          <p class="label">DAILY EXPENSE</p>
          <p id="avg-expense">

          </p>
        </div>
        <div class="card-net">
          <i data-lucide="minus" class="net-icon"></i>
          <p class="label">NET DAILY</p>
          <p id="net-daily">
          </p>
        </div>
      </div>
      <div class="card-container">
  
  <div class="card-section-top">
    <div class="box">
      <p class="label">TOTAL INCOME</p>
      <p id="total-income" class="value"></p>
    </div>

    <div class="box">
      <p class="label">TOTAL EXPENSES</p>
      <p id="total-expense" class="value"></p>
    </div>
  </div>

  <div class="card-section-bottom">
    <div class="box">
      <p class="label">NET</p>
      <p id="net-income" class="value"></p>
    </div>

    <!-- IMPORTANT: give this an id -->
    <div class="box" id="saved-box">
      <p class="label">SAVED</p>
      <p id="balance-percent"></p>
    </div>
  </div>

</div>


      <div class="card">
        <h4>Expense Breakdown</h4>
        <div class="toggle">
          <div class="type-selector2">
            <button id="expense-breakdown" class="active">Expenses</button>
            <button id="income-breakdown">Income</button>
          </div>
        </div>
        <div id="breakdown-list">

        </div>
      </div>  
    </div> 
      <!-- RECENT TRANSACTIONS -->  
       <div id="transactions-section">
      <div class="card">
        <h4>Recent</h4>
        <div id="transaction-list">

        </div>
      </div>
      </div>

</main>


<nav class="bottom-nav">
  <button class="nav-item active" data-page="dashboard" onclick="loadPage('dashboard')">
    <i data-lucide="layout-dashboard"></i>
    <span class="label">Dashboard</span>
  </button>

  <button class="nav-item" data-page="transactions" onclick="loadPage('transactions')">
    <i data-lucide="list"></i>
    <span class="label">Transactions</span>
  </button>

  <button class="plus-btn" onclick="openModal()">
    <i data-lucide="plus"></i>
  </button>

  <button class="nav-item" data-page="journey" onclick="loadPage('journey')">
    <i data-lucide="map"></i>
    <span class="label">Journey</span>
  </button>

  <button class="nav-item" data-page="profile" onclick="loadPage('profile')">
    <i data-lucide="user"></i>
    <span class="label">Profile</span>
  </button>
</nav>

<div id="modal" class="modal hidden">
  <div class="modal-content">
    <div class="card">
      <h3>Add Transaction</h3>
      <div class="type-selector">
        <input type="radio" name="transactionType" id="expense-type" checked>
        <label for="expense-type">Expenses</label>
        <input type="radio" name="transactionType" id="income-type">
        <label for="income-type">Income</label>
      </div>

      <form id="transaction-form">
        <div class="form-group">
          <label for="title-input">Title</label>
          <input type="text" id="title-input" placeholder="Enter title" required>
        </div>
        <div class="form-group">
          <label for="amount-input">Amount ($)</label>
          <input type="number" id="amount-input" placeholder="Enter amount" required>
        </div>
        <div class="form-group">
          <label for="category-select">Category</label>
          <select id="category-select"></select>
        </div>
        <div class="form-group">
          <label for="date-input">Date</label>
          <input type="date" id="date-input" required>
        </div>
        <div class="form-buttons">
          <button>Add Transaction</button>
          <button type="button" onclick="closeModal()">Close</button>
        </div>
      </form>
    </div>
  </div>
</div>


</div>
<script src="script.js"></script>

</body>
</html>
